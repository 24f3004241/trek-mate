{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow mb-5">
            <div class="card-header bg-success text-white text-center">
                <h4 class="mb-0">Add New Trek</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('add_trek') }}" method="POST">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">Trek Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">Location (City)</label>
                            <input type="text" class="form-control" name="location" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">State</label>
                            <input type="text" class="form-control" name="state" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">Country</label>
                            <input type="text" class="form-control" name="country" value="India" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label text-success fw-bold">Description</label>
                            <textarea class="form-control" name="description" rows="2" ></textarea>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Difficulty</label>
                            <select class="form-select" name="difficulty" required>
                                <option value="Easy">Easy</option>
                                <option value="Moderate">Moderate</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Duration (Days)</label>
                            <input type="number" class="form-control" name="duration" min="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Available Slots</label>
                            <input type="number" class="form-control" name="available_slots" min="1" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Price (₹)</label>
                            <input type="number" step="0.01" class="form-control" name="price" min="0" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Start Date</label>
                            <input type="date" class="form-control" name="start_date" min="{{ today }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">End Date</label>
                            <input type="date" class="form-control" name="end_date" min="{{ today }}" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-12">
                            <label class="form-label text-success fw-bold">Assign Trek Staff (Optional)</label>
                            <select class="form-select" name="staff_id">
                                <option value="">Select Staff</option>
                                {% for staff in staff_list %}
                                    <option value="{{ staff.id }}">{{ staff.user.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-dark w-100">Cancel</a>
                        </div>
                        <div class="col-md-6">
                            <button type="submit" class="btn btn-success w-100">Save Trek</button>
                        </div>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
