{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-success" style="border-radius: 12px;">
                <div class="card-header bg-success text-white text-center py-4">
                    <h3 class="mb-0 fw-bold">Confirm Your Booking</h3>
                </div>
                
                <div class="card-body p-5">
                    <div class="bg-light p-4 rounded mb-4 border">
                        <h4 class="fw-bold text-dark mb-2">{{ trek.name }}</h4>
                        <p class="text-muted mb-1"><i class="bi bi-geo-alt-fill text-success"></i> {{ trek.location }}</p>
                        <p class="text-muted mb-0"><i class="bi bi-calendar-event text-success"></i> {{ trek.start_date.strftime('%d %b, %Y') }}</p>
                    </div>

                    <form action="{{ url_for('book_trek', trek_id=trek.id) }}" method="POST">
                        
                        <div class="row mb-4 align-items-center">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Number of Seats</label>
                                <input type="number" name="seats_booked" id="seatsInput" class="form-control form-control-lg border-success" 
                                       min="1" max="{{ trek.available_slots }}" value="1" required>
                                <small class="text-muted">Maximum available: {{ trek.available_slots }}</small>
                            </div>
                            
                            <div class="col-md-6 text-end mt-3 mt-md-0">
                                <p class="text-muted mb-1">Price per seat: ₹<span id="basePrice">{{ trek.price }}</span></p>
                                <h3 class="fw-bold text-success mb-0">Total: ₹<span id="totalPrice">{{ trek.price }}</span></h3>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="form-check mb-4">
                            <input class="form-check-input border-success" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label text-muted" for="termsCheck">
                                I confirm that all details are correct and I agree to the terms and conditions.
                            </label>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold py-3">Confirm Booking & Pay</button>
                            <a href="{{ url_for('view_trek', id=trek.id) }}" class="btn btn-outline-secondary">Cancel and Go Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const InputSeats = document.getElementById('seatsInput');
    const basePrice = parseFloat(document.getElementById('basePrice').innerText);
    const totalPrice = document.getElementById('totalPrice');

    // Update total price automatically when user changes the number of seats
    InputSeats.addEventListener('input', function() {
        let seats = parseInt(this.value);
        if (seats > 0) {
            let total = seats * basePrice;
            totalPrice.innerText = total.toFixed(2);
        }
    });
</script>
{% endblock %}
