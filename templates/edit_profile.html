{% extends 'base.html' %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Profile Information</h5>
                </div>
                <div class="card-body p-4">
                    
                    <form action="{{ url_for('edit_profile') }}" method="POST">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control" name="full_name" value="{{ user.full_name if user.full_name }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Phone Number</label>
                                <input type="text" class="form-control" name="phone_number" value="{{ user.phone_number if user.phone_number }}">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Gender</label>
                                <select class="form-select" name="gender">
                                    <option value="">Select Gender</option>
                                    <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                                    <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                                    <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Date of Birth</label>
                                <input type="date" class="form-control" name="date_of_birth" value="{{ user.date_of_birth.strftime('%Y-%m-%d') if user.date_of_birth }}">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">City</label>
                                <input type="text" class="form-control" name="city" value="{{ user.city if user.city }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">State</label>
                                <input type="text" class="form-control" name="state" value="{{ user.state if user.state }}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Bio (A little about yourself)</label>
                            <textarea class="form-control" name="bio" rows="3">{{ user.bio if user.bio }}</textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('trekker_dashboard') }}" class="btn btn-secondary fw-bold px-4">Cancel</a>
                            <button type="submit" class="btn btn-success fw-bold px-4">Save Changes</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
