{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow mb-5">
            <div class="card-header bg-warning text-dark text-center fw-bold">
                <h4 class="mb-0">Edit Trek: {{ trek.name }}</h4>
            </div>
            <div class="card-body">
                
                <form action="{{ url_for('edit_trek', trek_id=trek.id) }}" method="POST">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">Trek Name</label>
                            <input type="text" class="form-control" name="name" value="{{ trek.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">Location (City)</label>
                            <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">State</label>
                            <input type="text" class="form-control" name="state" value="{{ trek.state }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-success fw-bold">Country</label>
                            <input type="text" class="form-control" name="country" value="{{ trek.country }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label text-success fw-bold">Description</label>
                            <textarea class="form-control" name="description" rows="2" >{{ trek.description }}</textarea>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Difficulty</label>
                            <select class="form-select" name="difficulty" required>
                                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Duration (Days)</label>
                            <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" min="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Available Slots</label>
                            <input type="number" class="form-control" name="available_slots" value="{{ trek.available_slots }}" min="1" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Price (₹)</label>
                            <input type="number" step="0.01" class="form-control" name="price" value="{{ trek.price }}" min="0" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">Start Date</label>
                            <!-- Date field pre-fill karne ke liye strftime use kiya -->
                            <input type="date" class="form-control" name="start_date" value="{{ trek.start_date.strftime('%Y-%m-%d') }}" min="{{ today }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-success fw-bold">End Date</label>
                            <input type="date" class="form-control" name="end_date" value="{{ trek.end_date.strftime('%Y-%m-%d') }}" min="{{ today }}" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-12">
                            <label class="form-label text-success fw-bold">Assign Trek Staff (Optional)</label>
                            <select class="form-select" name="staff_id">
                                <option value="">Select Staff</option>
                                {% for staff in staff_list %}
                                    <option value="{{ staff.id }}" {% if trek.staff_id == staff.id %}selected{% endif %}>{{ staff.user.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <a href="{{ url_for('manage_treks') }}" class="btn btn-outline-dark w-100">Cancel</a>
                        </div>
                        <div class="col-md-6">
                            <button type="submit" class="btn btn-warning fw-bold w-100">Update Trek</button>
                        </div>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
