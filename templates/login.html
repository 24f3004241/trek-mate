{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Trek Mate - Login</h4>
            </div>
            
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 fw-bold">Login</button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted">New User? <a href="{{ url_for('register') }}" class="text-decoration-none text-success fw-bold">Register here</a></p>
                </div>
                
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
