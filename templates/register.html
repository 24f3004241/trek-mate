{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-6">
        <div class="card shadow border-0">
            
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Trek Mate - Register</h4>
            </div>
            
            <div class="card-body p-4">
                <form action="{{ url_for('register') }}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label class="form-label fw-bold">Confirm Password</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Role</label>
                        <select class="form-select" name="role" required>
                            <option value="" selected disabled>Select your role</option>  
                            <option value="trekker">User (Trekker)</option>
                            <option value="staff">Trek Staff</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 fw-bold">Register</button>

                </form>

                <div class="text-center mt-4">
                    <p class="text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none text-success fw-bold">Login here</a></p>
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
